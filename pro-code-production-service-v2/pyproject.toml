[project]
name = "digital-economy-agent"
version = "0.1.0"
description = "Pro-code multi-agent RAG service for IMDA SEA digital economy policy research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "langgraph-checkpoint-postgres>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
ingestion = [
    "prefect>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["digital_economy_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-postgresql>=6.0",
]
