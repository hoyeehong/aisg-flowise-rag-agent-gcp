[project]
name = "digital-economy-agent"
version = "0.1.0"
description = "Pro-code multi-agent RAG service for IMDA SEA digital economy policy research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=1.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pypdf>=5.0",
    "langgraph-checkpoint-postgres>=2.0",
    "prometheus-client>=0.21",
    "pyjwt>=2.9",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
ingestion = [
    "prefect>=3.0",
]
# The event consumer. Optional for the same reason Prefect is: the HTTP service does
# not need a broker client, and the runtime image should not carry one it will not use.
events = [
    "google-cloud-pubsub>=2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["digital_economy_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# google-cloud-pubsub ships no py.typed marker, so its generated clients are untyped.
# Scoped to that module rather than relaxing strictness globally: the adapter around it
# is fully annotated, and this is the one boundary where the types stop.
[[tool.mypy.overrides]]
module = ["google.pubsub_v1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-postgresql>=6.0",
]
