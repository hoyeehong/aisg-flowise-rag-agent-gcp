# Local development dependencies. The service itself runs from the host (uvicorn) or
# from its own image; this file provides only what it depends on.
services:
  postgres:
    # pgvector on Postgres 17. Pinned by tag *and* verified by the healthcheck below,
    # because a missing extension surfaces as a confusing insert error much later.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: agent
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent"]
      interval: 5s
      timeout: 3s
      retries: 12

  pubsub:
    # Same image and flags CI uses, so a test that passes locally runs against the
    # same broker implementation rather than a similar one.
    #
    # Pinned by digest, not by tag. The Cloud SDK publishes a floating `:emulators`
    # tag and no versioned emulator tags, so a tag here would mean the broker under
    # test could change without anything in this repository changing.
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:45a15cc163d2df13137478856b4b9bb90426100fa8aec542269460c10110b727
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=test-project
    ports:
      - "8085:8085"
    healthcheck:
      # The emulator answers "Ok" over HTTP on the gRPC port once it is listening.
      test: ["CMD-SHELL", "curl -sf http://localhost:8085 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
