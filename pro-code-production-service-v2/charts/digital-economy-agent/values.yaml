# Defaults are production-shaped rather than convenient: no `latest` tag, resources
# always set, non-root enforced, and the model credential referenced from an existing
# Secret rather than templated into the release.

image:
  repository: digital-economy-agent
  # Pin by digest in production. A mutable tag means a pod restart can silently pull
  # different bits than its siblings are running.
  tag: ""            # defaults to .Chart.AppVersion
  digest: ""         # e.g. sha256:...; takes precedence over tag when set
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: ""
  # On GKE, bind a Google service account here for Workload Identity rather than
  # mounting a key file.
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Requests and limits are both set deliberately. Without requests the scheduler cannot
# place the pod sensibly and the HPA has no denominator for CPU utilisation; without
# limits one pod can starve its neighbours.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Scale-down is deliberately slow. A run paused at the human review gate lives in
  # Postgres, so it survives eviction -- but an in-flight report does not, and a report
  # takes seconds of model time that would be paid for twice.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Probe paths match the service's own semantics: readiness returns 503 when degraded so
# traffic drains, while liveness stays 200 whenever the process is up -- restarting
# cannot conjure a missing database.
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2
  startup:
    path: /healthz
    periodSeconds: 3
    # 60 * 3s: generous, because the first start applies the pgvector schema and the
    # checkpointer migrations. A tight startup probe would restart-loop through it.
    failureThreshold: 60

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Non-secret configuration, rendered into a ConfigMap.
config:
  AGENT_ENVIRONMENT: production
  AGENT_LOG_LEVEL: INFO
  AGENT_USE_IN_MEMORY_RETRIEVER: "false"
  AGENT_USE_POSTGRES_CHECKPOINTER: "true"
  AGENT_MODEL_CHAIN: "openai/gpt-oss-20b,llama-3.3-70b-versatile"
  AGENT_EMBEDDING_MODEL: gemini-embedding-001
  AGENT_EMBEDDING_DIMENSIONS: "768"
  AGENT_DEFAULT_TOP_K: "5"
  AGENT_MAX_REVISIONS: "3"

# Secrets are referenced, never templated. Putting a credential in values.yaml puts it
# in `helm get values`, in CI logs, and in every developer's shell history.
existingSecret:
  name: digital-economy-agent-secrets
  keys:
    groqApiKey: GROQ_API_KEY
    geminiApiKey: GEMINI_API_KEY
    postgresDsn: AGENT_POSTGRES_DSN
    # Ownership-carrying DSN, used only to apply the schema and the row-level-security
    # policy at startup. The query DSN above is a NOSUPERUSER role that deliberately
    # cannot run DDL, so without this the first deploy fails on CREATE TABLE.
    #
    # Set to "" to fall back to the query DSN, which only works where that role owns
    # the table -- and where it does, RLS does not apply to it, which /readyz reports.
    # Applying migrations from every starting pod is a simplification; a Job that runs
    # once per release is the better shape and is noted in the README.
    postgresAdminDsn: AGENT_POSTGRES_ADMIN_DSN

observability:
  otlpEndpoint: ""            # empty disables tracing
  serviceMonitor:
    enabled: false            # requires the Prometheus Operator CRDs
    interval: 30s
    scrapeTimeout: 10s

# Event-driven ingestion. A separate workload from the API: they scale on different
# signals, and a burst of ingestion must not slow report generation.
consumer:
  enabled: false          # opt in; requires a Pub/Sub subscription to exist
  replicaCount: 1
  # Full resource names, e.g. projects/<project>/subscriptions/<name>. Required when
  # enabled -- the chart fails to render rather than deploying a pod with nothing to
  # attach to, which would go ready and consume nothing.
  subscription: ""
  # Without a dead-letter topic Pub/Sub omits `delivery_attempt`, so the consumer's
  # retry ceiling never fires and a poison message is redelivered forever. Terraform
  # creates both together for this reason.
  deadLetterTopic: ""
  concurrency: 4
  maxDeliveryAttempts: 5
  port: 8081
  # Generous, so an in-flight batch can finish and acknowledge on SIGTERM rather than
  # being killed and redelivered.
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Deliberately no HPA. The signal that matters is subscription backlog, not CPU: a
  # consumer waiting on the embedding provider is idle by CPU and behind by backlog, so
  # a CPU-based HPA would scale down exactly when it should scale up. Backlog-based
  # autoscaling needs KEDA or a custom metrics adapter; until one is in the cluster,
  # replicaCount is set by hand and is honest about being fixed.

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraEnv: []
