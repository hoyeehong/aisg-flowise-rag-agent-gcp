{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent.serviceAccountName" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The service calls out to model providers and Postgres; it never calls the Kubernetes
# API, so it has no RBAC bindings and does not need its token mounted.
automountServiceAccountToken: false
{{- end }}
