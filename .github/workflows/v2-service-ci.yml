name: v2 service CI

# Scoped to the v2 service: the v1 prototype is frozen, so changes there should not
# trigger (or be gated by) this pipeline.
on:
  push:
    branches: [main]
    paths:
      - "pro-code-production-service-v2/**"
      - ".github/workflows/v2-service-ci.yml"
  pull_request:
    paths:
      - "pro-code-production-service-v2/**"
      - ".github/workflows/v2-service-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: pro-code-production-service-v2

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Real Postgres with pgvector. The retrieval integration tests exercise the
      # generated tsvector column, HNSW cosine ordering and ON CONFLICT idempotency --
      # all of which live in SQL, so a fake would test nothing.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      TEST_POSTGRES_DSN: postgresql://postgres:devpass@localhost:5432/agent

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true
          cache-dependency-glob: pro-code-production-service-v2/uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock is stale, so CI cannot pass against a lockfile
        # that does not match pyproject.toml.
        run: uv sync --frozen --extra dev

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy digital_economy_agent/

      - name: Verify Postgres is reachable
        # The retrieval tests skip themselves when Postgres is absent, which is right
        # locally but would silently hollow out CI. Failing here keeps the skip an
        # explicit local convenience rather than an accidental coverage gap.
        run: |
          uv run python -c "
          import os, sys, psycopg
          dsn = os.environ['TEST_POSTGRES_DSN']
          try:
              with psycopg.connect(dsn, connect_timeout=10):
                  print('postgres reachable:', dsn.rsplit('@', 1)[-1])
          except Exception as exc:
              print(f'::error::postgres unreachable, retrieval tests would skip: {exc}')
              sys.exit(1)
          "

      - name: pytest
        # No model provider is contacted: chat calls use scripted providers and
        # embeddings use the deterministic hashing embedder, so a green run never
        # depends on an API being up or in quota. Postgres is real, by design.
        run: uv run pytest -q --junitxml=junit.xml

      - name: Assert retrieval tests actually ran
        # Guards against the skip-if-unavailable marker quietly disabling this suite.
        run: |
          uv run python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          cases = [c for c in root.iter("testcase")
                   if "test_retrieval_pg" in (c.get("classname") or "")]
          skipped = [c for c in cases if c.find("skipped") is not None]
          print(f"retrieval integration tests: {len(cases)} collected, {len(skipped)} skipped")
          if not cases or skipped:
              raise SystemExit("::error::retrieval integration tests did not run against Postgres")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: pro-code-production-service-v2/junit.xml
          if-no-files-found: warn

  image:
    name: container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: pro-code-production-service-v2
          push: false
          load: true
          tags: digital-economy-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Proves the container actually serves traffic, not merely that it builds.
        run: |
          docker run -d --name agent -p 8080:8080 \
            -e AGENT_GROQ_API_KEY=ci-dummy \
            digital-economy-agent:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::service did not become healthy"; docker logs agent; exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/readyz
          docker rm -f agent

      - name: Scan image for vulnerabilities
        # Uses the official Trivy image rather than the marketplace action, pinned to an
        # exact version. Two reasons: this is byte-for-byte the command that can be run
        # locally, so CI and a developer's laptop cannot disagree; and it removes a
        # third-party action from the supply chain for this step.
        #
        # Blocking: the image was verified at zero fixable HIGH/CRITICAL findings, so the
        # gate is actionable rather than noise. --ignore-unfixed keeps it that way — only
        # vulnerabilities with an available fix can fail the build.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.74.0 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              digital-economy-agent:${{ github.sha }}
