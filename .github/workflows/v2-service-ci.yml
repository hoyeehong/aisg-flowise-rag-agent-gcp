name: v2 service CI

# Scoped to the v2 service: the v1 prototype is frozen, so changes there should not
# trigger (or be gated by) this pipeline.
on:
  push:
    branches: [main]
    paths:
      - "pro-code-production-service-v2/**"
      - ".github/workflows/v2-service-ci.yml"
  pull_request:
    paths:
      - "pro-code-production-service-v2/**"
      - ".github/workflows/v2-service-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: pro-code-production-service-v2

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Real Postgres with pgvector. The retrieval integration tests exercise the
      # generated tsvector column, HNSW cosine ordering and ON CONFLICT idempotency --
      # all of which live in SQL, so a fake would test nothing.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      TEST_POSTGRES_DSN: postgresql://postgres:devpass@localhost:5432/agent

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: pro-code-production-service-v2/uv.lock

      - name: Install dependencies
        # --frozen fails if uv.lock is stale, so CI cannot pass against a lockfile
        # that does not match pyproject.toml.
        #
        # The ingestion extra is included because flow.py type checks against the real
        # Prefect decorators under TYPE_CHECKING. Without it installed, mypy cannot see
        # them and the type checking of that module would be vacuous. The
        # optional-deps job below separately proves Prefect remains optional at runtime.
        run: uv sync --frozen --extra dev --extra ingestion

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy digital_economy_agent/

      - name: Verify Postgres is reachable
        # The retrieval tests skip themselves when Postgres is absent, which is right
        # locally but would silently hollow out CI. Failing here keeps the skip an
        # explicit local convenience rather than an accidental coverage gap.
        run: |
          uv run python -c "
          import os, sys, psycopg
          dsn = os.environ['TEST_POSTGRES_DSN']
          try:
              with psycopg.connect(dsn, connect_timeout=10):
                  print('postgres reachable:', dsn.rsplit('@', 1)[-1])
          except Exception as exc:
              print(f'::error::postgres unreachable, retrieval tests would skip: {exc}')
              sys.exit(1)
          "

      - name: pytest
        # No model provider is contacted: chat calls use scripted providers and
        # embeddings use the deterministic hashing embedder, so a green run never
        # depends on an API being up or in quota. Postgres is real, by design.
        run: uv run pytest -q --junitxml=junit.xml

      - name: Assert retrieval tests actually ran
        # Guards against the skip-if-unavailable marker quietly disabling this suite.
        run: |
          uv run python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          cases = [c for c in root.iter("testcase")
                   if "test_retrieval_pg" in (c.get("classname") or "")]
          skipped = [c for c in cases if c.find("skipped") is not None]
          print(f"retrieval integration tests: {len(cases)} collected, {len(skipped)} skipped")
          if not cases or skipped:
              raise SystemExit("::error::retrieval integration tests did not run against Postgres")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: junit-results
          path: pro-code-production-service-v2/junit.xml
          if-no-files-found: warn

  optional-deps:
    name: prefect stays optional
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: pro-code-production-service-v2/uv.lock

      - name: Install WITHOUT the ingestion extra
        run: uv sync --frozen --extra dev

      - name: Assert the service works with no orchestrator installed
        # The claim is that Prefect is optional and the API image need not carry it.
        # A comment asserting that is worth nothing; this proves it.
        run: |
          uv run python -c "
          import importlib.util, sys
          if importlib.util.find_spec('prefect') is not None:
              sys.exit('::error::prefect is installed; this job must run without it')

          from digital_economy_agent.api.app import create_app
          from digital_economy_agent.ingestion import ingest_pages, PatternRedactor
          from digital_economy_agent.ingestion.flow import PREFECT_AVAILABLE, ingest_corpus_flow
          assert PREFECT_AVAILABLE is False, 'flow.py should report prefect missing'
          assert callable(ingest_corpus_flow), 'flow must stay callable via the shims'
          print('service and ingestion pipeline import cleanly without prefect')
          "

      - name: Run the suite that does not need an orchestrator
        run: uv run pytest tests/unit -q

  evals:
    name: retrieval eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DSN: postgresql://postgres:devpass@localhost:5432/agent
      AGENT_POSTGRES_DSN: postgresql://postgres:devpass@localhost:5432/agent
      AGENT_GROQ_API_KEY: not-needed-for-retrieval-only
      AGENT_USE_IN_MEMORY_RETRIEVER: "false"
      # Explicit opt-in to the deterministic embedder. This is what makes the eval a
      # required check: retrieval quality is measured with no API key and no quota, so
      # it cannot be flaky because a provider is rate limited.
      AGENT_ALLOW_HASHING_EMBEDDER: "true"
      AGENT_TENANT_ID: ci
      AGENT_USE_POSTGRES_CHECKPOINTER: "false"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: pro-code-production-service-v2/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ingest the corpus
        # The same pipeline the service uses, with the deterministic embedder so the
        # index is byte-identical on every run and the metrics below are reproducible.
        run: |
          uv run python -m digital_economy_agent.ingestion \
            --dsn "$DSN" --tenant ci --allow-hashing-embedder \
            ../data/imda_report.pdf

      - name: Start the service
        run: |
          uv run uvicorn --factory digital_economy_agent.api.app:create_app \
            --port 8000 --log-level warning > /tmp/service.log 2>&1 &
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/readyz || echo 000)
            [ "$code" = "200" ] && { echo "ready after ${i}s"; exit 0; }
            sleep 1
          done
          echo "::error::service never became ready"
          curl -s http://localhost:8000/readyz || true
          cat /tmp/service.log
          exit 1

      - name: Confirm the corpus covers the golden sets
        # A recall figure is only meaningful over a corpus containing the ground truth.
        # Without this the eval could silently pass on an empty index.
        run: |
          uv run python -c "
          import json, sys, urllib.request
          with urllib.request.urlopen('http://localhost:8000/v1/corpus', timeout=30) as r:
              body = json.load(r)
          pages = body.get('total_pages', 0)
          print(f'indexed pages: {pages}')
          if pages < 70:
              sys.exit(f'::error::only {pages} pages indexed; ingest did not complete')
          "

      - name: Retrieval eval gate
        # Fails the build on a regression beyond tolerance, or below an absolute floor.
        run: |
          uv run python -m evals.harness \
            --target http://localhost:8000 \
            --retrieval-only \
            --dataset evals/golden/retrieval-anchored.v1.jsonl \
            --baseline evals/baselines/retrieval-ci.json \
            --out /tmp/eval-report.json \
            --gate

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eval-report
          path: /tmp/eval-report.json
          if-no-files-found: warn

      - name: Service logs on failure
        if: failure()
        run: cat /tmp/service.log

  image:
    name: container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, optional-deps, evals]

    services:
      # The smoke test runs the image twice -- once without a database and once with --
      # to assert that readiness actually reflects reality in both directions.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: pro-code-production-service-v2
          push: false
          load: true
          tags: digital-economy-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image — degraded without a database
        # Asserts the probe contract, not merely that the container answers. Readiness
        # must report 503 with no database, because a readiness probe routes on the
        # status code alone. Liveness must stay 200: restarting cannot conjure a
        # database, so a failing liveness probe would only cause a restart loop.
        run: |
          docker run -d --name agent-degraded -p 8080:8080 \
            -e AGENT_GROQ_API_KEY=ci-dummy \
            digital-economy-agent:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            if [ "$i" = "30" ]; then
              echo "::error::container never became live"; docker logs agent-degraded; exit 1
            fi
            sleep 1
          done

          live=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz)
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/readyz)
          body=$(curl -s http://localhost:8080/readyz)
          echo "healthz=$live readyz=$ready"
          echo "$body"

          [ "$live" = "200" ] || { echo "::error::liveness should be 200, got $live"; exit 1; }
          [ "$ready" = "503" ] || { echo "::error::readiness should be 503 with no database, got $ready"; exit 1; }
          echo "$body" | grep -q '"durable_checkpointer":false' \
            || { echo "::error::readyz did not name the failing check"; exit 1; }
          docker rm -f agent-degraded

      - name: Smoke test the image — ready with a database
        # The complement: given a real database the same image must reach 200/ready,
        # which also proves it can connect to Postgres and create its checkpoint tables
        # from inside the container rather than only from the test runner.
        run: |
          docker run -d --name agent-ready --network host \
            -e AGENT_GROQ_API_KEY=ci-dummy \
            -e AGENT_POSTGRES_DSN=postgresql://postgres:devpass@localhost:5432/agent \
            digital-economy-agent:${{ github.sha }}
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/readyz || echo 000)
            [ "$code" = "200" ] && { echo "ready after ${i}s"; break; }
            if [ "$i" = "45" ]; then
              echo "::error::never became ready (last status $code)"
              curl -s http://localhost:8080/readyz || true
              docker logs agent-ready
              exit 1
            fi
            sleep 1
          done
          curl -s http://localhost:8080/readyz
          curl -s http://localhost:8080/readyz | grep -q '"status":"ready"' \
            || { echo "::error::readyz reported 200 without status ready"; exit 1; }
          docker rm -f agent-ready

      - name: Scan image for vulnerabilities
        # Uses the official Trivy image rather than the marketplace action, pinned to an
        # exact version. Two reasons: this is byte-for-byte the command that can be run
        # locally, so CI and a developer's laptop cannot disagree; and it removes a
        # third-party action from the supply chain for this step.
        #
        # Blocking: the image was verified at zero fixable HIGH/CRITICAL findings, so the
        # gate is actionable rather than noise. --ignore-unfixed keeps it that way — only
        # vulnerabilities with an available fix can fail the build.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.74.0 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              digital-economy-agent:${{ github.sha }}
